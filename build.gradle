plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.5'
	id 'io.spring.dependency-management' version '1.1.7'
	//spotless플러그인 추가
	id 'com.diffplug.spotless' version '6.25.0'}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// --- [Web & Template Engine] ---
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-validation' // 입력값 검증

	// --- [API Documentation - Swagger/OpenAPI] ---
	// http://localhost:8080/swagger-ui/index.html 접속으로 확인 가능
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'

	// --- [Security & Authentication] ---
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

	// JWT (Json Web Token)
	implementation 'io.jsonwebtoken:jjwt:0.9.1'
	implementation 'javax.xml.bind:jaxb-api:2.3.1'

	// --- [Database & Persistence] ---
	// SQL (RDB)
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'com.mysql:mysql-connector-j' // Production 환경용

	// NoSQL (MongoDB)
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'

	// --- [Performance & Async Tools] ---
	implementation 'org.springframework.boot:spring-boot-starter-aop'      // AOP 프록시 지원
	implementation 'org.springframework.retry:spring-retry:2.0.7'         // 실패 재시도 로직
	implementation 'org.apache.httpcomponents.client5:httpclient5'        // 외부 API 통신

	// --- [Scheduled Task & Locking] ---
	implementation 'net.javacrumbs.shedlock:shedlock-spring:5.14.0'
	implementation 'net.javacrumbs.shedlock:shedlock-provider-mongo:5.14.0'

	// --- [Utilities] ---
	implementation 'org.springframework.boot:spring-boot-starter-mail'    // 메일 발송
	compileOnly 'org.projectlombok:lombok'                                // 상용구 코드 자동 생성
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor' // 커스텀 설정 지원

	// --- [Development & Testing] ---
	developmentOnly 'org.springframework.boot:spring-boot-devtools'       // 핫 리로드 지원
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test' // 시큐리티 테스트 지원
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	//test
	testRuntimeOnly 'com.h2database:h2'
}

// --- Spotless 설정 블록 ---
spotless {
	java {
		// 적용할 자바 파일 경로 지정
		target '**/*.java'

		// 사용하지 않는 import 제거
		removeUnusedImports()

		// 구글 자바 포맷 적용 (버전 지정 가능, 기본값 사용)
		googleJavaFormat().aosp()

		// 끝에 빈 줄 추가, 불필요한 공백 제거
		trimTrailingWhitespace()
		endWithNewline()
	}
}

// 1. JUnit 플랫폼 선언 (선택 사항, 있어도 무방)
tasks.named('test') {
	useJUnitPlatform()
}

// 2. 테스트 완전히 비활성화
//tasks.withType(Test) {
//	enabled = false
//}

jar{
	enabled=false
}
// 자바 코드를 컴파일하기 전에 무조건 spotlessApply를 먼저 실행하도록 설정
tasks.named('compileJava') {
	dependsOn 'spotlessApply'
}