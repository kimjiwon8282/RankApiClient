plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.5'
	id 'io.spring.dependency-management' version '1.1.7'
	//spotless플러그인 추가
	id 'com.diffplug.spotless' version '6.25.0'}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	//타임리스 + 웹
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'

	//컴파일 전용 + 어노테이션 프로세싱
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	//test관련
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	//HttpClient
	implementation 'org.apache.httpcomponents.client5:httpclient5'

	//데이터베이스
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'com.mysql:mysql-connector-j' // prod용
	runtimeOnly 'com.h2database:h2' // local용


	// Spring Security + OAuth2 & JWT
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'io.jsonwebtoken:jjwt:0.9.1'
	implementation 'javax.xml.bind:jaxb-api:2.3.1'

	// @ConfigurationProperties 지원
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	// @Retryable 동작용 (AOP 프록시)
	implementation 'org.springframework.boot:spring-boot-starter-aop'

	// 실패 재시도
	implementation 'org.springframework.retry:spring-retry:2.0.7'

	// ShedLock (스프링 연동 + Mongo 프로바이더)
	implementation 'net.javacrumbs.shedlock:shedlock-spring:5.14.0'
	implementation 'net.javacrumbs.shedlock:shedlock-provider-mongo:5.14.0'

	//메일
	implementation 'org.springframework.boot:spring-boot-starter-mail'

	//개발 시 잠깐 사용(타임리프 바로 반영 DevTools)
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
}

// --- Spotless 설정 블록 ---
spotless {
	java {
		// 적용할 자바 파일 경로 지정
		target '**/*.java'

		// 사용하지 않는 import 제거
		removeUnusedImports()

		// 구글 자바 포맷 적용 (버전 지정 가능, 기본값 사용)
		googleJavaFormat().aosp()

		// 끝에 빈 줄 추가, 불필요한 공백 제거
		trimTrailingWhitespace()
		endWithNewline()
	}
}

// 1. JUnit 플랫폼 선언 (선택 사항, 있어도 무방)
tasks.named('test') {
	useJUnitPlatform()
}

// 2. 테스트 완전히 비활성화 (중요)
tasks.withType(Test) {
	enabled = false
}

jar{
	enabled=false
}
// 자바 코드를 컴파일하기 전에 무조건 spotlessApply를 먼저 실행하도록 설정
tasks.named('compileJava') {
	dependsOn 'spotlessApply'
}