spring:
  datasource:
    url: jdbc:mysql://localhost:3306/rankcat?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME_LOCAL}
    password: ${DB_PASSWORD_LOCAL}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

cookie:
  same-site: Lax
  secure: false

cors:
  allowed-origins:
    - http://localhost:5173
    - http://localhost:8080
    - http://127.0.0.1:5173
    - http://127.0.0.1:8080

logging:
  level:
    org.springframework.security: DEBUG


app:
  frontend:
    oauth-success-url: ${APP_FRONTEND_OAUTH_SUCCESS_URL:http://localhost:5173/home.html}