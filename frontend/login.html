<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/typography.css">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
<div class="login-new">
    <div class="login-body">
        <div class="container">
            <div>
                <h2>로그인/회원가입</h2>
            </div>

            <div class="join-buttons">
                <!-- 소셜 로그인 -->
                <div class="social-login">
                    <!-- 구글 -->
                    <a id="btn-google" class="login-button" href="/oauth2/authorization/google">
                        <i class="login-button-logo icon-google-login-logo"></i>
                        <span>구글로 시작하기</span>
                    </a>

                    <!-- 네이버 -->
                    <a id="btn-naver" class="login-button" href="/oauth2/authorization/naver">
                        <i class="login-button-logo icon-naver-login-logo"></i>
                        <span>네이버로 시작하기</span>
                    </a>
                </div>

                <!-- 구분선 -->
                <div class="divider">
                    <span>OR</span>
                </div>

                <!-- 로컬(일반) 로그인 -->
                <div class="local-login">
                    <form id="loginForm" class="sign-in-form">
                        <input id="email" type="email" placeholder="이메일" required>
                        <input id="password" type="password" placeholder="비밀번호" required>

                        <div class="login-options">
                            <label>
                                <input type="checkbox">
                                아이디 기억하기
                            </label>
                            <a href="#">비밀번호를 잊으셨나요?</a>
                        </div>

                        <button type="submit">로그인하기</button>
                    </form>
                </div>
            </div>

            <!-- 회원가입 페이지로 이동 -->
            <div class="local-signup">
                <p>아직 회원이 아니신가요? <a href="/signup.html">회원가입 하러 가기</a></p>
            </div>
        </div>
    </div>
</div>

<script type="module" src="/js/applogin.js"></script>
</body>
</html>
